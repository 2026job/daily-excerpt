name: Material Replenishment

on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *"

concurrency:
  group: material-replenishment
  cancel-in-progress: false

jobs:
  replenish-material-pool:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run replenishment tests
        run: python -m pytest tests/test_material_pool.py tests/test_replenish_material_pool.py -v

      - name: Replenish material pool
        run: |
          python scripts/replenish_material_pool.py \
            --material-pool data/material_pool/seed.json \
            --candidate-pool data/material_pool/xiaohongshu_candidates.json \
            --output-dir data/output \
            --max-details 1

      - name: Upload replenishment logs
        uses: actions/upload-artifact@v4
        with:
          name: material-replenishment-output
          path: data/output/

      - name: Commit replenished material pool
        run: |
          if ! git diff --quiet -- data/material_pool/seed.json data/material_pool/xiaohongshu_candidates.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/material_pool/seed.json data/material_pool/xiaohongshu_candidates.json
            git commit -m "chore: replenish material pool"
            git pull --rebase
            git push
          fi
