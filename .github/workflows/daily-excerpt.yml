name: Daily Excerpt

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "10 22 * * *"

jobs:
  build-daily-excerpt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -v

      - name: Build daily excerpt dry run
        env:
          XHS_NOTE_URL: ${{ secrets.XHS_NOTE_URL }}
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
          TENCENT_OCR_REGION: ${{ secrets.TENCENT_OCR_REGION }}
        run: |
          RUN_DATE="$(TZ=Asia/Shanghai date +%F)"
          if [ -n "${XHS_NOTE_URL}" ]; then
            python scripts/build_daily_excerpt.py \
              --dry-run \
              --date "$RUN_DATE" \
              --note-url "$XHS_NOTE_URL"
          else
            python scripts/build_daily_excerpt.py \
              --dry-run \
              --date "$RUN_DATE" \
              --raw-note-html data/raw/xiaohongshu-c80cf3e1ef14.html
          fi

      - name: Upload dry-run output
        uses: actions/upload-artifact@v4
        with:
          name: daily-excerpt-output
          path: data/output/
